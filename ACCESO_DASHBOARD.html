<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Dashboard Obj.3</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        .container {
            background: rgba(255, 255, 255, 0.96);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        .spinner {
            border: 4px solid #e9ecef;
            border-top: 4px solid #1e3c72;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 1s linear infinite;
            margin: 25px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h1 { color: #1e3c72; font-size: 24px; margin-bottom: 10px; }
        p { color: #555; font-size: 15px; line-height: 1.5; min-height: 45px; }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 28px;
            background: #1e3c72;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn:hover { background: #162c55; transform: translateY(-1px); }
        .status-dot { display: inline-block; width: 10px; height: 10px; background: #ffc107; border-radius: 50%; margin-right: 8px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍇 Vendimia 5.0 - Objetivo 3</h1>
        <div class="spinner" id="loader"></div>
        <p id="msg"><span class="status-dot"></span>Cargando motor climático y tablas fenológicas en memoria...<br><small style="color:#888;">(Esto suele tomar entre 5 y 10 segundos)</small></p>
        
        <a href="http://127.0.0.1:7862" class="btn">Forzar Entrada Manual</a>

        <div style="margin-top: 25px; font-size: 13px; color: #777; border-top: 1px solid #eee; padding-top: 15px;">
            Desarrollador: <a href="file:///C:/Users/dnunezs/.gemini/antigravity/scratch/portfolio-diego/index.html" target="_blank" style="color: #1e3c72; text-decoration: none; font-weight: bold;">Diego Núñez Simms</a>
        </div>
    </div>

    <script>
        const targetUrl = 'http://127.0.0.1:7862';
        let intentos = 0;

        function checkServer() {
            intentos++;
            if (intentos > 15) {
                document.getElementById('msg').innerHTML = "⚠️ El servidor tarda más de lo habitual. Asegúrate de no haber cerrado la terminal negra.";
            }

            fetch(targetUrl, { mode: 'no-cors' })
                .then(() => {
                    document.getElementById('msg').innerHTML = "<b style='color:#28a745;'>✔ ¡Motor listo! Entrando...</b>";
                    document.getElementById('loader').style.borderTopColor = '#28a745';
                    setTimeout(() => {
                        window.location.replace(targetUrl);
                    }, 500);
                })
                .catch(() => {
                    setTimeout(checkServer, 1000);
                });
        }

        // Iniciar sondeo inteligente cada 1 segundo
        setTimeout(checkServer, 1000);
    </script>
</body>
</html>
